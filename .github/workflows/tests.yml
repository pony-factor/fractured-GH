name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  node-tests:
    name: Node tests (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run all test suites
        run: node --test

  lint:
    name: Lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
            -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
      - name: Lint JavaScript
        run: npx --yes --package eslint@9.39.1 eslint --config eslint.config.mjs .

  package:
    name: Validate and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension manifest and assets
        run: node scripts/validate-extension.mjs
      - name: Build extension archive
        run: |
          zip -q -r "$RUNNER_TEMP/fractured-github.zip" \
            manifest.json background.js options.html options.js options-page.js \
            options.css features fonts icons
          unzip -t "$RUNNER_TEMP/fractured-github.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: fractured-github-extension
          path: ${{ runner.temp }}/fractured-github.zip
          if-no-files-found: error

  chromium-smoke:
    name: Packaged extension Chromium smoke
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: fractured-github-extension
          path: ${{ runner.temp }}/extension-artifact
      - name: Extract extension archive
        run: unzip "$RUNNER_TEMP/extension-artifact/fractured-github.zip" -d "$RUNNER_TEMP/packaged-extension"
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test extension in Chromium
        run: node scripts/smoke-extension.mjs
        env:
          EXTENSION_PATH: ${{ runner.temp }}/packaged-extension
